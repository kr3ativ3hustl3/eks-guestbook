name: Build, Push, and Deploy

# All Docker builds happen here, on GitHub's hosted runners — never
# locally (same reason as every other project in this series: this
# dev machine's older macOS can't run Docker Desktop).
on:
  push:
    branches: [main]
    paths:
      - "app/**"

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_URL }}
        run: |
          cd app
          docker build -t "$ECR_REPOSITORY:latest" -t "$ECR_REPOSITORY:${{ github.sha }}" .
          docker push "$ECR_REPOSITORY:latest"
          docker push "$ECR_REPOSITORY:${{ github.sha }}"

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name eks-guestbook-cluster --region us-east-1

      - name: Roll out the new image
        run: |
          kubectl rollout restart deployment/guestbook
          kubectl rollout status deployment/guestbook --timeout=180s
